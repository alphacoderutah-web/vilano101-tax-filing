    bedrooms: 8
    components: ["Pink Flamingo (109 Meadow, 4BR)", "The Palms (101 Meadow, 4BR)"]
  - listing: "Coastal Duo: Bliss & Olive"
    ownerrez_id: 475320
    bedrooms: 7
    components: ["Olive (505A Twentieth, 2BR)", "Vilano Bliss (507 Twentieth, 5BR)"]
combo_tax_warning: >-
  A booking on a combo listing is revenue for TWO homes. Counting a combo listing AND its
  components as separate properties double-counts the taxable base. Counting only the
  components misses combo bookings entirely. 10 single-home listings + 3 combo listings
  = 13 OwnerRez records covering 10 physical homes.

tax_scope_rule: >-
  CURRENT LISTING STATUS DOES NOT DETERMINE AUGUST 2026 TAX SCOPE. What matters is whether a
  property took taxable revenue DURING the period being filed. A house snoozed on 1 September
  may still have had August stays; a house live today may have had none. Resolve inclusion
  from the August booking data, not from live/snoozed status. Local snapshots are dated
  2026-08-26 and are stale for this purpose.

